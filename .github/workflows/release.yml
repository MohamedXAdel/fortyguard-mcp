name: Release

# Tag-driven. `git tag v0.2.0 && git push --tags` builds, verifies and publishes.
#
# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token in
# this repository's secrets to leak or rotate. Configure it once at
# https://pypi.org/manage/account/publishing/ with:
#
#   owner        MohamedXAdel
#   repository   fortyguard-mcp
#   workflow     release.yml
#   environment  pypi
#
# The `pypi` environment is where you add a required reviewer if you want a
# human to approve each release. TestPyPI uses the `testpypi` environment
# and its own pending publisher at test.pypi.org.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The full gate again, on the tagged commit. A tag can point anywhere, so
  # "CI was green on main" is not the same statement as "this artifact is good".
  verify:
    name: verify py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,verify]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q

  build:
    name: build + check artifacts
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: No credentials in either artifact
        # `tests/` ships in the sdist, so this is not theoretical: it has
        # already caught a live API key pasted into a test as fixture data.
        run: python scripts/check_artifacts.py dist/

      - name: Metadata is valid for PyPI
        run: twine check --strict dist/*

      - name: The tag matches the packaged version
        # A tag that disagrees with pyproject publishes a version nobody can
        # find, and the name is then burned on PyPI forever.
        id: version
        run: |
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag v$TAG does not match pyproject version $VERSION"
              exit 1
            fi
          fi

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "from fortyguard_mcp.server import build_server; build_server()"
          /tmp/clean/bin/fortyguard-mcp --version
          /tmp/clean/bin/fortyguard-mcp --print-config

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed."
